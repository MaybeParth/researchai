[project]
name = "researchai"
version = "0.1.0"
description = "Personal research agent: plans, researches, finds evidence gaps, and writes cited reports."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "deepagents",
    "langchain-anthropic",
    "tavily-python",
    "fastapi",
    "uvicorn",
    "sse-starlette",
    "pydantic>=2",
    "pydantic-settings",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff", "httpx"]

[project.scripts]
researchai = "researchai.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/researchai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
